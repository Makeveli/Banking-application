name: Deploy to EC2

on:
  push:
    branches:
      - main

# Prevent multiple deployments at the same time
concurrency:
  group: prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          # Timeouts (IMPORTANT)
          timeout: 30m
          command_timeout: 30m

          # Enable debugging logs
          debug: true

          script: |
            set -x

            echo "Step 1: Navigate to project"
            cd /home/ec2-user/projects/Banking-application

            echo "Step 2: Pull latest code"
            git pull

            echo "Step 3: Stop existing containers"
            docker-compose down

            echo "Step 4: Build Docker image"
            docker-compose build --progress=plain

            echo "Step 5: Start containers"
            docker-compose up -d

            echo "Step 6: Deployment completed successfully"